<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="robots" content="noindex">
<title>Kontakt</title>
<style>
 body{font:15px/1.45 Arial,Helvetica,sans-serif;margin:0;padding:10px 14px;background:#fff8e1;color:#1d1d1d}
 .z{margin:0 0 8px} b{color:#7a4b00} .m{color:#666;font-size:13px} .w{color:#b00020}
</style></head>
<body><div id="box"></div>
<script>
// Daten kommen nur im #-Teil der Adresse (wird nie an den Server geschickt).
// Pipedrive Calls: #stand=..&ziel=..&letzter=..&phase=..&faellig=..   Kaltakquise: #aufhaenger=..&einstieg=..&achtung=..&info=..
var p = new URLSearchParams(location.hash.slice(1));
function v(k){ var x = p.get(k) || ""; return /^\{ld_/.test(x) ? "" : x; }
function zeile(label, k, cls){ var x = v(k); if (!x) return "";
  var d = document.createElement("div"); d.className = "z " + (cls || "");
  var b = document.createElement("b"); b.textContent = label + ": "; d.appendChild(b); d.appendChild(document.createTextNode(x));
  document.getElementById("box").appendChild(d); return x; }
if (p.has("aufhaenger")) {
  var a = zeile("AUFHÄNGER", "aufhaenger") + zeile("EINSTIEG", "einstieg") + zeile("ACHTUNG", "achtung", "w");
  zeile("Letzter Call", "info", "m");
  if (!a) document.getElementById("box").textContent = "Keine Website-Infos zu diesem Kontakt.";
} else {
  zeile("STAND", "stand"); zeile("ZIEL", "ziel");
  var m = document.createElement("div"); m.className = "m";
  m.textContent = "Letzter Kontakt: " + (v("letzter") || "–") + " · Phase: " + (v("phase") || "–") + " · Fällig: " + (v("faellig") || "–");
  document.getElementById("box").appendChild(m);
}
</script>
</body></html>
